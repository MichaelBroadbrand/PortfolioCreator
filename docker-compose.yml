services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: dev
    ports:
      - "5001:5000"
    env_file:
      - "./server/serversecrets.env"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/portfolio-builder
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY:-}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID:-}
      - LEMONSQUEEZY_VARIANT_ID=${LEMONSQUEEZY_VARIANT_ID:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - "./client/clientsecrets.env"
    environment:
      - VITE_DEV_API_TARGET=http://server:5000
      - VITE_API_URL=/api
    depends_on:
      - server

volumes:
  mongo_data:
