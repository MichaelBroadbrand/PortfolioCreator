services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build:
      context: ./server
      target: prod
    env_file:
      - ./server/serversecrets.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/portfolio-builder
      - CLIENT_URL=https://yourdomain.com
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  client:
    build:
      context: ./client
      target: prod
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
